<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Guan Yin Temple 观音堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#120806">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Noto+Serif+SC:wght@400;600;900&family=Ma+Shan+Zheng&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a full-bleed "window" into the temple; everything else floats on lacquer-and-gold glass over the scene. Single dark world by design. */
:root{
  --ink:#120806;          /* night lacquer */
  --lacquer:#3a0f0a;      /* temple red-black */
  --vermilion:#b3261e;    /* pillar red */
  --gold:#d9a441;         /* gilt */
  --gold-hi:#f6d58a;      /* gilt highlight */
  --paper:#f3e6c4;        /* joss paper */
  --smoke:#e9e2d6;        /* text */
  --muted:#b9a993;
  --glass:rgba(24,10,7,.72);
  --line:rgba(217,164,65,.35);
  --f-display:"Cormorant Garamond","Noto Serif SC",Georgia,serif;
  --f-zh:"Noto Serif SC","Songti SC","SimSun",serif;
  --f-brush:"Ma Shan Zheng","Noto Serif SC","KaiTi",serif;
  --f-ui:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--smoke);font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}

/* ---------- viewer ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;perspective:1100px;background:#000}
#gl,#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;mix-blend-mode:screen}
#hots{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 60%,rgba(0,0,0,.35) 100%)}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .6s ease}
#fade.on{opacity:1}

.hs{position:absolute;left:0;top:0;transition:opacity .3s;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px;pointer-events:auto}
.hs .dot{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,var(--gold-hi) 0 30%,rgba(217,164,65,.5) 31% 60%,transparent 61%);box-shadow:0 0 0 2px rgba(246,213,138,.7),0 0 18px rgba(246,213,138,.8);animation:pulse 2.2s ease-in-out infinite}
.hs .lbl{font:600 12px/1.2 var(--f-ui);letter-spacing:.04em;padding:4px 9px;border-radius:999px;background:rgba(18,8,6,.72);border:1px solid var(--line);white-space:nowrap;color:var(--gold-hi);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.hs.small .lbl{display:none}
.hs.small .dot{width:14px;height:14px}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:1}}

/* ---------- HUD ---------- */
.hud-top{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) max(14px,env(safe-area-inset-right,0px)) 10px max(14px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(10,4,3,.75),transparent);pointer-events:none;z-index:20}
.hud-top>*{pointer-events:auto}
.place{display:flex;flex-direction:column;line-height:1.05;min-width:0;flex:1 1 auto}
.place .en{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{flex:0 1 auto}
.place .zh{font:900 20px var(--f-zh);color:var(--gold-hi);letter-spacing:.12em;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.place .en{font:italic 500 15px var(--f-display);color:var(--muted)}
.tools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:999px;padding:7px 11px;font:600 12px var(--f-ui);letter-spacing:.03em;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip .ember{width:8px;height:8px;border-radius:50%;background:#ff8a3c;box-shadow:0 0 8px 2px #ff6a1a;animation:emb 1.6s infinite}
@keyframes emb{50%{box-shadow:0 0 12px 4px #ff7a2a;background:#ffb070}}
.hud-bot{position:fixed;left:0;right:0;bottom:0;padding:18px max(14px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(14px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(10,4,3,.85) 55%);z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:760px}
.act{border:1px solid rgba(246,213,138,.55);background:linear-gradient(180deg,rgba(179,38,30,.92),rgba(110,18,12,.92));border-radius:12px;padding:9px 14px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:84px;box-shadow:inset 0 1px 0 rgba(255,220,150,.35),0 6px 18px rgba(0,0,0,.4)}
.act b{font:900 16px var(--f-zh);color:var(--gold-hi);letter-spacing:.1em}
.act span{font:500 11px var(--f-ui);color:#f3dcc0;letter-spacing:.04em;margin-top:3px}
.act.ghost{background:rgba(18,8,6,.7);border-color:var(--line)}
.hint{font:500 12px var(--f-ui);color:var(--muted);text-align:center;text-wrap:balance}

/* ---------- activity canvas ---------- */
#stage{position:fixed;inset:0;width:100%;height:100%;touch-action:none;z-index:30;display:block}
.cue{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);z-index:35;text-align:center;pointer-events:none;width:min(92vw,560px)}
.cue .zh{font:900 26px var(--f-zh);color:var(--gold-hi);letter-spacing:.15em;text-shadow:0 2px 16px #000}
.cue .en{font:italic 600 18px var(--f-display);color:var(--smoke);text-shadow:0 2px 12px #000}
.cue .sub{display:inline-block;font:500 13px var(--f-ui);color:#efe4d2;margin-top:8px;padding:6px 12px;border-radius:999px;background:rgba(10,4,3,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.cue .sub:empty{display:none}
.close{position:fixed;z-index:40;top:calc(env(safe-area-inset-top,0px) + 12px);left:max(12px,env(safe-area-inset-left,0px));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:20px;line-height:1}

#dnav{position:fixed;z-index:40;left:0;right:0;top:46%;display:flex;align-items:center;justify-content:space-between;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
#dnav button{pointer-events:auto}
#ddots{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 168px)}
#dnav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--glass);font-size:26px;line-height:1;color:var(--gold-hi)}
#ddots{display:flex;gap:6px}#ddots span{width:7px;height:7px;border-radius:50%;background:rgba(246,213,138,.35)}#ddots span.on{background:var(--gold-hi)}
.mix{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;margin-top:14px}
.mix b{font:600 14px var(--f-ui)}.mix input[type=range]{width:100%;accent-color:var(--gold)}
.tog{border:1px solid var(--line);background:#0d0504;border-radius:999px;padding:6px 12px;font:600 12px var(--f-ui);min-width:58px}.tog[aria-pressed="true"]{background:var(--gold);color:#2a0d08}
#mbar{position:fixed;z-index:46;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 64px);width:min(560px,calc(100% - 20px));display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:16px;background:rgba(20,8,6,.86);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.mbp{width:44px;height:44px;border-radius:50%;border:1px solid rgba(246,213,138,.6);background:linear-gradient(#b3261e,#7a140e);color:var(--gold-hi);font-size:16px;flex:0 0 auto}
.mbmid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}#mbTitle{font:600 13px var(--f-ui);color:var(--gold-hi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mbar input[type=range]{width:100%;accent-color:var(--gold);margin:0}.mbrow{display:flex;align-items:center;gap:8px;font:500 11px var(--f-ui);color:var(--muted);font-variant-numeric:tabular-nums}.mbrow input{flex:1}.mbv{margin:0;font:600 11px var(--f-ui);letter-spacing:0;text-transform:none}
#mbPick{font-size:13px;padding:6px 8px}#mbClose{border:0;background:none;color:var(--muted);font-size:20px;align-self:flex-start}#mbCredit{text-align:left;font-size:10px}
#shelfv{position:fixed;inset:0;z-index:30;background:radial-gradient(120% 90% at 30% 20%,#3a2414,#120806 70%);display:flex;align-items:flex-end}
.shelfscroll{width:100%;height:100%;overflow-x:auto;overflow-y:hidden;display:flex;align-items:flex-end;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px)}
.shelfbox{position:relative;flex:0 0 auto;margin:0 auto;height:calc(100% - 150px);aspect-ratio:2000/1116;max-width:none;background:url("img/shelf.jpg") center/100% 100%;container-type:size;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.bk{position:absolute;border:0;padding:6% 0;cursor:pointer;border-radius:3px 3px 1px 1px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4%;color:var(--f);
 background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(255,255,255,.16) 16%,rgba(255,255,255,0) 38%,rgba(0,0,0,.12) 70%,rgba(0,0,0,.5)),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,rgba(0,0,0,.04) 1px 3px),var(--c);
 box-shadow:inset 0 0 0 1px rgba(0,0,0,.45),inset 0 6px 0 -3px var(--f),inset 0 -6px 0 -3px var(--f),3px 0 6px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.2,.8,.2,1),filter .2s;transform-origin:50% 100%}
.bk:hover,.bk:focus-visible{transform:translateY(-5%);filter:brightness(1.12)}.bk.out{transform:translateY(-35%) rotate(-4deg) scale(1.04);z-index:2}
.bk .bt{position:absolute;left:0;right:0;top:9%;height:60%;display:block;writing-mode:vertical-rl;margin:0 auto;width:max-content;font:900 var(--fs,2.9cqh)/1.02 var(--f-zh);white-space:nowrap;letter-spacing:.02em;text-shadow:0 1px 0 rgba(0,0,0,.5);overflow:hidden}
.bk .be{position:absolute;left:0;right:0;bottom:7%;height:22%;display:block;writing-mode:vertical-rl;margin:0 auto;width:max-content;font:600 1.3cqh/1 var(--f-ui);opacity:.85;overflow:hidden;white-space:nowrap}
.bk.light{color:#5a1a10}.bk.light .bt{text-shadow:none}
.deco{position:absolute;pointer-events:none}.deco.stack{background:repeating-linear-gradient(180deg,#5e1a12 0 30%,#d9c7a0 30% 34%,#1f2a44 34% 64%,#d9c7a0 64% 68%,#2f5446 68% 100%);border-radius:2px;box-shadow:2px 3px 6px rgba(0,0,0,.6)}
.deco.s2{background:repeating-linear-gradient(180deg,#8a5a12 0 45%,#e9e2d0 45% 50%,#4a2a5e 50% 100%)}
.deco.box{background:linear-gradient(#6b4423,#3d2412);border-radius:3px;box-shadow:inset 0 2px 0 rgba(255,220,160,.25),2px 3px 6px rgba(0,0,0,.6)}
.deco.bowlx{background:radial-gradient(ellipse at 50% 20%,#f3d98a,#9b6d2c 60%,#3a2510);border-radius:0 0 50% 50%/0 0 100% 100%}
#cover{position:fixed;inset:0;z-index:38;background:rgba(10,4,3,.7);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:70px max(16px,env(safe-area-inset-right,0px)) 20px max(16px,env(safe-area-inset-left,0px));overflow:auto}
.covwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:820px}.covinfo{flex:1 1 280px;min-width:0;max-width:440px}
.covinfo h2{margin:0;font:900 26px var(--f-zh);color:var(--gold-hi)}.covinfo h3{margin:2px 0 0;font:italic 600 21px var(--f-display)}.covinfo p{font:400 15px/1.6 var(--f-ui);color:#e6dccd}
.cvr{position:relative;width:min(58vw,280px);aspect-ratio:3/4.3;border-radius:3px 8px 8px 3px;color:var(--f);animation:cvin .5s cubic-bezier(.2,.8,.2,1);
 background:linear-gradient(90deg,rgba(0,0,0,.35),rgba(255,255,255,.08) 6%,rgba(0,0,0,0) 12%,rgba(0,0,0,0) 85%,rgba(0,0,0,.3)),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,rgba(0,0,0,.05) 2px 4px),repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 2px,rgba(0,0,0,.04) 2px 4px),var(--c);
 box-shadow:0 30px 60px rgba(0,0,0,.6),inset 0 0 0 1px rgba(0,0,0,.4)}
@keyframes cvin{from{transform:translateY(30px) rotateX(20deg);opacity:0}}
.cvr::after{content:"";position:absolute;right:5%;top:4%;bottom:4%;border-right:2px dotted color-mix(in srgb,var(--f) 70%,transparent)}
.cvf{position:absolute;inset:6% 12% 6% 6%;border:2px solid var(--f);outline:1px solid color-mix(in srgb,var(--f) 50%,transparent);outline-offset:4px;display:flex;flex-direction:column;align-items:flex-start;padding:7%}
.cvf .ct{writing-mode:vertical-rl;background:#f3e6c4;color:#2a120c;font:400 clamp(22px,6.4vw,34px)/1.1 var(--f-brush);padding:10px 6px;border:1px solid #b89a5a;box-shadow:2px 2px 0 rgba(0,0,0,.25);max-height:62%;overflow:hidden}
.cvf .cs{font:600 11px/1.4 var(--f-zh);margin-top:auto;opacity:.9}.cvf .ce{font:italic 600 15px var(--f-display);margin-top:4px}
.cvf .lotus{position:absolute;right:10%;top:36%;width:34%;opacity:.8}
.cvr.light{color:#7a5a20}.cvr.light .cvf .ct{background:#fff}
#reader{position:fixed;inset:0;z-index:30;overflow:hidden;background:#120806}
.rbg{position:absolute;inset:-4%;background:url("deity/med_gy.jpg") 50% 30%/cover;animation:breathe 16s ease-in-out infinite alternate;filter:brightness(.85)}
@keyframes breathe{to{transform:scale(1.06)}}
#reader::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,rgba(10,4,3,.75));pointer-events:none}
.rtools{position:absolute;z-index:3;right:max(12px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 12px);display:flex;gap:6px}
.rbook{position:absolute;z-index:2;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);transform:translateX(-50%) perspective(1400px) rotateX(14deg);transform-origin:50% 100%;width:min(94vw,560px);height:min(60vh,640px);perspective:1600px;touch-action:pan-y;cursor:pointer}
.pg{position:absolute;inset:0;border-radius:4px 10px 10px 4px;padding:18px 20px 14px 26px;overflow:auto;color:#2a1a10;
 background:linear-gradient(90deg,rgba(90,60,20,.28),rgba(0,0,0,0) 7%),radial-gradient(120% 90% at 60% 40%,#f8f0dc,#ecdcb6);box-shadow:0 20px 50px rgba(0,0,0,.6),inset 0 0 40px rgba(140,100,40,.18)}
.pg .ph{display:flex;justify-content:space-between;font:600 11px var(--f-zh);color:#9a3a1a;letter-spacing:.1em;border-bottom:1px solid rgba(154,58,26,.35);padding-bottom:6px;margin-bottom:10px}.pg .ph span{font-family:var(--f-ui)}
.pl{display:flex;flex-direction:column;gap:6px}.ln{font:400 22px/1 var(--f-zh);letter-spacing:.04em}.ln em{font:600 10px var(--f-ui);color:#b3261e;margin-right:6px;font-style:normal;vertical-align:middle}
.ln ruby{ruby-position:over;margin:0 1px}.ln rt{font:500 10.5px var(--f-ui);color:#8a3a1a;letter-spacing:0}.pu{color:#9a6a3a}
.pe{margin-top:12px;padding-top:8px;border-top:1px dashed rgba(154,58,26,.35);font:italic 500 16px/1.45 var(--f-display);color:#4a3020}
.pf{text-align:right;font:600 12px var(--f-ui);color:#9a3a1a;margin-top:8px}
.pg.intro .ptitle{font:400 40px/1.1 var(--f-brush);color:#5a1a10;text-align:center;margin:8px 0}.pg.intro .psub{text-align:center;font:500 13px/1.5 var(--f-zh);color:#6a4a30}.pg.intro p{font:400 14px/1.6 var(--f-ui);color:#3a2a1a}.pg.intro p.zhp{font-family:var(--f-zh)}
.pg.flip{z-index:3;pointer-events:none;animation:flipF .62s ease-in forwards;transform-origin:0 50%}.pg.flip.back{animation-name:flipB;transform-origin:100% 50%}
@keyframes flipF{to{transform:rotateY(-170deg);opacity:.2;filter:brightness(.6)}}@keyframes flipB{to{transform:rotateY(170deg);opacity:.2;filter:brightness(.6)}}
@media (max-width:420px){.ln{font-size:19px}.pg{padding:14px 14px 12px 20px}}
/* ---------- sheets ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:center;padding:0 max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));pointer-events:none}
.sheet .card{pointer-events:auto;width:min(620px,100%);max-height:86vh;overflow:auto;background:linear-gradient(180deg,#2a0d08,#160806);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 20px calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -20px 60px rgba(0,0,0,.6);animation:up .35s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.card h2{margin:0;font:900 24px var(--f-zh);color:var(--gold-hi);letter-spacing:.08em;text-wrap:balance}
.card h3{margin:2px 0 0;font:italic 600 20px var(--f-display);color:var(--smoke)}
.card p{font:400 15px/1.6 var(--f-ui);color:#e6dccd;margin:12px 0 0;max-width:62ch}
.card .zhp{font-family:var(--f-zh)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{flex:1 1 140px;border:1px solid rgba(246,213,138,.6);background:linear-gradient(180deg,#b3261e,#7a140e);border-radius:12px;padding:12px 14px;font:600 14px var(--f-ui);color:#fff3dc}
.btn small{display:block;font:900 15px var(--f-zh);color:var(--gold-hi);letter-spacing:.08em;margin-bottom:2px}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--smoke)}
.x{float:right;border:0;background:none;color:var(--muted);font-size:22px;margin:-6px -6px 0 0;padding:4px 8px}
input,select{font:500 16px var(--f-ui);color:var(--smoke);background:#0d0504;border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
label{font:600 12px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:14px 0 6px}
.amts{display:flex;gap:6px;flex-wrap:wrap}
.amts button{border:1px solid var(--line);background:#0d0504;border-radius:999px;padding:8px 14px;font:600 14px var(--f-ui);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:600 11px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;border:1px solid var(--line);color:var(--gold-hi)}
.zgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:14px}
.zgrid button{border:1px solid var(--line);background:#0d0504;border-radius:10px;padding:8px 2px;display:flex;flex-direction:column;align-items:center}
.zgrid b{font:900 20px var(--f-zh);color:var(--gold-hi)}
.zgrid span{font:500 10px var(--f-ui);color:var(--muted)}

/* ---------- lot paper ---------- */
.lothead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.lotnum{font:900 30px var(--f-zh);color:var(--gold-hi);letter-spacing:.06em}
.rating{font:900 15px var(--f-zh);padding:5px 12px;border-radius:8px;background:var(--paper);color:var(--vermilion)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;font:600 13px var(--f-ui)}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a0d08}
.sheetimg{margin-top:14px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.sheetimg img{display:block;width:100%;height:auto}
.meaning{margin-top:14px;padding:14px;border-radius:12px;background:rgba(243,230,196,.06);border:1px solid var(--line)}
.meaning h4{margin:0 0 4px;font:600 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.meaning p{margin:6px 0 0}

/* ---------- light offering wall ---------- */

<script>

/* ============================================================ state */
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem('gy_'+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem('gy_'+k,JSON.stringify(v))}catch(e){}}};
const S={lang:store.get('lang','en'),sound:true,mus:store.get('mus',{on:true,v:.7}),sfx:store.get('sfx',{on:true,v:.8}),scene:null,mode:'view'};
const tt=(en,zh)=>S.lang==='en'?en:zh;
const isTouch=matchMedia('(pointer:coarse)').matches;
const INCENSE_MS=30*60*1000; // a real joss stick burns about half an hour
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const rnd=(a,b)=>a+Math.random()*(b-a);

/* 100 lots: rating from the Bright Hill (光明山普觉禅寺) sheets. U=上签 M=中签 L=下签 */
const RATE="ULLUMMLUMMUUMMMMMUMMUMMLMMMMMMMMMMMMMLLMMUUMUMUMMMUMMLMMMMMLMMMLLLUMMLMMULMMMUMUUMMLMUMMUUMUMLMUMLLL";
const RATING={
  U:{zh:'上签',en:'Auspicious',ex:['An upper lot. Conditions are favourable. Keep your intentions sincere and act with diligence so the good fortune can ripen.','上签。时机顺遂，福报将至。保持真诚与精进，好运自然成就。']},
  M:{zh:'中签',en:'Neutral',ex:['A middle lot. Results depend on your own effort and timing. Be patient, steady and careful, and things can turn for the better.','中签。成败在于自身努力与时机。耐心稳重，谨慎行事，可望转好。']},
  L:{zh:'下签',en:'Inauspicious',ex:['A lower lot is a gentle warning, not a sentence. Slow down, avoid risky moves for now, do good deeds and seek advice. Guan Yin points out obstacles so you can avoid them.','下签是提醒，并非定数。宜放慢脚步，暂避冒险，多行善事、多听劝告。观音指出障碍，是为了让你避开它。']}
};
const ZHNUM=n=>{const d='〇一二三四五六七八九';if(n===100)return'一百';const t=Math.floor(n/10),o=n%10;return (t?(t>1?d[t]:'')+'十':'')+(o?d[o]:'')};

/* ============================================================ deities & places */
const INFO={
 guanyin:{zh:'千手千眼观世音菩萨',en:'Thousand-Armed Guan Yin',t:['Avalokiteśvara, the Bodhisattva of Great Compassion, "the one who hears the cries of the world". Her thousand arms and thousand eyes show that she sees suffering everywhere and reaches out to help. The Great Compassion Mantra (大悲咒) belongs to this form. She is also the patron Buddha of those born in the Year of the Rat.','观世音菩萨，大慈大悲，寻声救苦。千手表护持众生，千眼表观照世间。《大悲咒》即出自千手观音。亦为生肖属鼠者的本命佛。']},
 shancai:{zh:'善财童子',en:'Sudhana (Shancai Tongzi)',t:['The young pilgrim of the Avataṃsaka Sūtra who visited 53 teachers in search of wisdom. Guan Yin was one of them. He stands at her left as a model of the sincere seeker.','《华严经》中参访五十三位善知识的童子，观音菩萨是其中之一。侍立观音身旁，象征求道者的真诚之心。']},
 longnu:{zh:'龙女',en:'The Dragon Girl (Longnü)',t:['Daughter of the Dragon King. In the Lotus Sūtra she offers a precious pearl to the Buddha and attains awakening in an instant, showing that enlightenment is open to everyone. She attends Guan Yin holding the pearl.','龙王之女，于《法华经》中献宝珠于佛，当下成佛，表明人人皆可觉悟。手捧明珠，侍立观音身旁。']},
 weituo:{zh:'韦驮菩萨',en:'Skanda (Wei Tuo)',t:['Guardian of the Dharma and of the monastery, clad in armour with a vajra staff. In Chinese temples he faces the main shrine to protect the teachings and the monastic community.','护法韦驮天尊，身披甲胄，手持金刚杵，护持佛法与僧团，常面向大殿主尊而立。']},
 qielan:{zh:'伽蓝菩萨',en:'Sangharama (Qielan)',t:['Protector of the temple grounds. In Chinese Buddhism he is identified with General Guan Yu (关羽), honoured for loyalty and righteousness, and stands opposite Wei Tuo.','守护寺院道场的护法。汉传佛教中以关羽关圣帝君为伽蓝菩萨，表忠义，与韦驮菩萨相对而立。']},
 amitabha:{zh:'阿弥陀佛',en:'Amitābha Buddha',t:['The Buddha of Infinite Light and Life, who presides over the Western Pure Land. Reciting "Namo Amituofo" is the heart of Pure Land practice. Patron Buddha for the Dog and the Pig.','无量光、无量寿佛，西方极乐世界教主。持念"南无阿弥陀佛"是净土法门的核心。为属狗、属猪者的本命佛。']},
 mahasthama:{zh:'大势至菩萨',en:'Mahāsthāmaprāpta',t:['The Bodhisattva of Great Strength, who shines the light of wisdom on all beings. With Guan Yin he attends Amitābha as one of the Three Saints of the West. Patron for the Horse.','以智慧之光普照一切，令众生离三途、得无上力。与观音菩萨同为阿弥陀佛胁侍，合称西方三圣。属马者本命佛。']},
 gy_willow:{zh:'观世音菩萨（杨柳净瓶）',en:'Guan Yin with Willow and Vase',t:['Here Guan Yin attends Amitābha as one of the Three Saints of the West. She sprinkles the sweet dew of compassion (甘露) from her vase with a willow branch, healing and purifying.','西方三圣之一。手持杨柳枝与净瓶，遍洒甘露，消灾除病，清净身心。']},
 whiterobe:{zh:'白衣观音',en:'White-Robed Guan Yin',t:['One of the 33 forms of Guan Yin and the most loved in Chinese homes. The white robe stands for purity. People pray to her for peace and safety.','三十三观音之一，最为民间所熟悉。白衣象征清净无染，信众多祈求平安吉祥。']},
 watermoon:{zh:'水月观音',en:'Water-Moon Guan Yin',t:['Seated at ease gazing at the moon reflected on water. She teaches that all things are like the moon in water: clearly seen, yet without fixed substance.','闲坐观看水中之月，示现诸法如水中月，宛然可见而本性空寂。']},
 songzi:{zh:'送子观音',en:'Child-Giving Guan Yin',t:['Holding an infant, she is prayed to by families wishing for children and for a safe birth.','怀抱婴儿，信众祈求子嗣与母子平安。']},
 dragon:{zh:'龙头观音',en:'Dragon-Head Guan Yin',t:['One of the 33 forms, standing on a dragon among the clouds. She shows mastery over the forces of nature and protects those who travel.','三十三观音之一，乘龙立于云端，示现降伏自然之力，护佑出行平安。']},
 medicine:{zh:'药师琉璃光如来',en:'Medicine Buddha',t:['Bhaiṣajyaguru, the Buddha of healing, radiant as lapis lazuli. He made twelve great vows to heal illness of body and mind. Holds a medicine bowl.','药师佛发十二大愿，消除众生身心病苦，延年益寿。身如琉璃，手持药钵。']},
 shakyamuni:{zh:'释迦牟尼佛',en:'Shakyamuni Buddha',t:['The historical Buddha and founder of Buddhism, revered as the Original Teacher (本师). He taught the path that ends suffering.','佛教创始人，娑婆世界本师，开示离苦得乐之道。']},
 akasagarbha:{zh:'虚空藏菩萨',en:'Ākāśagarbha',t:['The Bodhisattva whose wisdom and merit are vast as space. Patron for the Ox and the Tiger.','福德智慧如虚空般广大无边。属牛、属虎者的本命佛。']},
 manjushri:{zh:'文殊菩萨',en:'Mañjuśrī',t:['The Bodhisattva of Great Wisdom. His sword cuts through ignorance and he rides a lion. Patron for the Rabbit.','大智文殊师利菩萨，以智慧剑斩断烦恼，骑狮子。属兔者的本命佛。']},
 samantabhadra:{zh:'普贤菩萨',en:'Samantabhadra',t:['The Bodhisattva of Great Practice and Vows, riding a white six-tusked elephant. Patron for the Dragon and the Snake.','大行普贤菩萨，以十大愿王著称，乘六牙白象。属龙、属蛇者的本命佛。']},
 vairocana:{zh:'大日如来',en:'Vairocana Buddha',t:['The Great Sun Buddha, whose wisdom shines everywhere like sunlight. Patron for the Goat and the Monkey.','毗卢遮那佛，智慧光明如大日遍照。属羊、属猴者的本命佛。']},
 acala:{zh:'不动明王',en:'Acala, the Immovable One',t:['A fierce Wisdom King holding a sword and rope amid flames, burning away obstacles and guarding practitioners. Patron for the Rooster.','怒目持剑与羂索，背负火焰，烧尽障碍，守护修行者。属鸡者的本命佛。']},
 tiangong:{zh:'天公（玉皇上帝）',en:'Tian Gong, Lord of Heaven',t:['In Singapore temples, devotees first offer incense to Heaven at the Tian Gong censer, facing the open sky, before entering the halls. Tian Gong is the Jade Emperor of Chinese tradition; Buddhists relate him to Śakra (帝释天), a protector of the Dharma. His birthday falls on the 9th day of the 1st lunar month.','新加坡寺庙习俗，入殿前先面向天空于天公炉上香敬天。天公即玉皇上帝，佛教中对应护法帝释天。农历正月初九为天公诞。']},
 cundi:{zh:'准提观音',en:'Cundi Guan Yin',t:['Cundī, "Mother of Seven Koṭis of Buddhas", is honoured in Chinese Buddhism as a form of Guan Yin. Her eighteen arms hold the tools of compassion and wisdom. She is the main deity of Kwan Im Thong Hood Cho Temple (四马路观音堂) on Waterloo Street. Her mantra ends: Om cale cule cundi svaha.','准提菩萨，号"七俱胝佛母"，汉传佛教视为观音化身之一。十八臂执持慈悲与智慧法器。四马路观音堂主供即为准提观音。准提咒：南无飒哆喃，三藐三菩陀，俱胝喃，怛侄他，唵，折隶主隶，准提娑婆诃。']},
 kings:{zh:'四大天王',en:'The Four Heavenly Kings',t:['Guardians of the four directions: Dhṛtarāṣṭra (east, pipa), Virūḍhaka (south, sword), Virūpākṣa (west, serpent) and Vaiśravaṇa (north, umbrella). They protect the Dharma and bring good weather and peace.','护持四方：东方持国天王（琵琶）、南方增长天王（宝剑）、西方广目天王（龙）、北方多闻天王（宝伞），寓意风调雨顺、国泰民安。']},
 damo:{zh:'达摩祖师',en:'Bodhidharma (Damo)',t:['The Indian monk who brought Chan (Zen) Buddhism to China in the 5th–6th century and is honoured as its First Patriarch. He is remembered for nine years of wall-gazing meditation at Shaolin.','南天竺僧人，南北朝时来华传禅，为中土禅宗初祖，相传于少林寺面壁九年。']},
 huatuo:{zh:'华佗',en:'Hua Tuo',t:['The celebrated physician of the Eastern Han dynasty, revered as a deity of healing. Devotees pray to him for good health and recovery.','东汉名医，被尊为医神，信众祈求身体健康、早日康复。']},
 cintamani:{zh:'如意轮观音',en:'Cintāmaṇicakra Guan Yin',t:['A six-armed Guan Yin holding the wish-fulfilling jewel (如意宝珠) and the Dharma wheel, who fulfils wishes and turns the wheel of the teaching. At the Buddha Tooth Relic Temple she is enshrined in the Universal Wisdom Hall, surrounded by the eight zodiac guardian Buddhas.','六臂观音，手持如意宝珠与法轮，满众生愿，转大法轮。新加坡佛牙寺普智殿供奉如意轮观音，四周即为八大生肖守护本命佛。']},
 medgy:{zh:'白玉观音 · 禅修室',en:'White Jade Guan Yin',t:['The meditation room (禅堂) is kept simple and quiet so the mind can settle. Kneel on the cushion facing Guan Yin, choose a mantra book from the shelf, and recite slowly, page by page, with the breath.','禅修室陈设简朴安静，让心安住。跪坐蒲团，面向观音，从书架选一本经咒，随呼吸一页一页慢慢诵读。']},
 lamp:{zh:'光明灯',en:'Light Offering',t:['Lighting a lamp before the Buddha stands for dispelling the darkness of ignorance with wisdom. Devotees light a lamp for a year for peace, health, studies or career, with their name on a red label.','佛前点灯，象征以智慧之光破除无明黑暗。信众为自己或家人点灯一年，祈求平安、健康、学业、事业，名字写于红纸贴上。']},
 kaucim:{zh:'求签',en:'Drawing a Guan Yin Lot',t:['Kneel before Guan Yin, quietly say your name, birth date, where you live and one clear question. Shake the cylinder until a single stick falls, then collect the lot paper with that number. The 100 lots here are from Bright Hill Pu Jue Chan Monastery.','跪于观音前，默念姓名、生辰、住址及所求之事，摇动签筒至一支签落下，再按号取签文。此处一百首签文源自光明山普觉禅寺。']},
 donate:{zh:'功德箱',en:'Merit Box',t:['Offerings support the upkeep of the temple, its free meals and its charity work. Giving with a joyful heart (随喜) is itself a practice of generosity.','善款用于寺院维护、斋饭与慈善。随喜布施，本身即是修行。']}
};

 courtyard:{img:'scenes/courtyard.jpg',vid:'scenes/courtyard_sky.mp4',music:['audio/om-mani-padme-hum.mp3',.28],zh:'观音堂 · 外院',en:'Temple Courtyard',
  hots:[{x:50.5,y:38,k:'enter',en:'Enter the hall',zh:'入殿'},{x:50.5,y:86,k:'burner',en:'Incense urn',zh:'香炉'},{x:85.8,y:60,k:'lamp',en:'Lamp of fire',zh:'灯火'},{x:95,y:74,k:'joss',en:'Joss sticks',zh:'香'}],
  vsmoke:[[50.5,68.5,.2,.85],[49,69,.14,.6]],smoke:[[50.5,66,3]],glow:[[85.8,68.2,30,'255,170,70'],[30,62,12,'255,160,70'],[70,62,12,'255,160,70'],[50.5,66,24,'255,120,40']],look:[0,.1]},

 const mine=store.get('lamps',[]);const total=63;let seedLit=[];let s=7;for(let i=0;i<total;i++){s=(s*9301+49297)%233280;if(s/233280<.42)seedLit.push(i)}

 const grid=W.querySelector('#lamps');for(let i=0;i<total;i++){const d=document.createElement('div');d.className='lamp';d.dataset.i=i;const m=mine.find(x=>x.i===i);if(m){d.classList.add('lit','mine')}else if(seedLit.includes(i))d.classList.add('lit');d.innerHTML=BUDDHA_SVG+`<div class="lbl">${m?esc(m.name):(d.classList.contains('lit')?'福':'')}</div>`;d.onclick=()=>{if(pending)stickTo(d)};grid.appendChild(d)}
 let pending=null,stEl=null;
 W.querySelector('#wf').onsubmit=e=>{e.preventDefault();const name=W.querySelector('#wn').value.trim();if(!name){W.querySelector('#wn').focus();toast(tt('Write a name first','请先写名字'));return}
  pending={name,b:+W.querySelector('#wb').value};stEl?.remove();stEl=document.createElement('div');stEl.className='sticker';stEl.textContent=name;document.body.appendChild(stEl);stEl.style.left=(innerWidth/2-29)+'px';stEl.style.top=(innerHeight*.35)+'px';
  grid.querySelectorAll('.lamp:not(.lit)').forEach(l=>l.classList.add('target'));toast(tt('Drag the red label onto a dark lamp, or tap a lamp','把红纸拖到未亮的灯上，或点击一盏灯'),3500);
  let dd=null;stEl.onpointerdown=ev=>{stEl.setPointerCapture(ev.pointerId);dd={x:ev.clientX-stEl.offsetLeft,y:ev.clientY-stEl.offsetTop}};

 function stickTo(el){if(!pending)return;if(el.classList.contains('lit')){toast(tt('This lamp is already lit. Choose a dark one.','此灯已点亮，请选未亮的灯。'));return}
  el.classList.add('lit','mine');el.querySelector('.lbl').textContent=pending.name;AU.bell(330,.3);const m=store.get('lamps',[]);m.push({i:+el.dataset.i,name:pending.name,b:pending.b,d:Date.now()});store.set('lamps',m);
  grid.querySelectorAll('.target').forEach(l=>l.classList.remove('target'));stEl?.remove();stEl=null;const bl=blessings[pending.b];pending=null;

 $('#closeBtn').onclick=()=>{W.hidden=true;stEl?.remove();$('#closeBtn').hidden=true;hud(true);S.mode='view';$('#closeBtn').onclick=()=>{closeStage();$('#wall').hidden=true;renderActions()}}}

 $('#mbTitle').textContent=t?(S.lang==='zh'?t[0]:t[1]):tt('No music here','此处无音乐');$('#mbPlay').textContent=(!o||o.a.paused)?'▶':'❚❚';$('#mbPlay').setAttribute('aria-label',(!o||o.a.paused)?'Play':'Pause');
 const d=o?o.a.duration:0,c=o?o.a.currentTime:0;const sk=$('#mbSeek');if(!sk.matches(':active')){sk.max=d||1;sk.value=c}$('#mbTime').textContent=fmt(c)+' / '+fmt(d);$('#mbVol').value=S.mus.v;

 ['heart',0,.17],['dabei',0,.215],['mani',0,.26],

 [['deco stack',.6,1,.2,.035],['deco stack s2',.62,1,.16,.03],['deco box',.37,0,.1,.09],['deco stack',.42,2,.22,.03],['deco bowlx',.65,0,.07,.05]].forEach(([c,x,bay,w,h])=>{const d=document.createElement('span');d.className=c;d.style.cssText=`left:${x*100}%;bottom:${(1-BAY[bay][1])*100}%;width:${w*100}%;height:${h*100}%`;box.appendChild(d)});
 requestAnimationFrame(()=>{const sc=v.querySelector('.shelfscroll');sc.scrollLeft=(sc.scrollWidth-sc.clientWidth)*.12});cue('经书架','Mantra bookshelf',tt('Tap a book to take it out.','点击一本经书取出。'));$('#cue').style.zIndex=36;

function coverHTML(b,big){return `<div class="cvr${b.light?' light':''}" style="--c:${b.col};--f:${b.foil}"><div class="cvf"><svg viewBox="0 0 60 40" class="lotus" aria-hidden="true"><path d="M30 6c4 6 5 14 0 24-5-10-4-18 0-24zM18 12c6 2 10 9 11 18-8-3-12-10-11-18zM42 12c1 8-3 15-11 18 1-9 5-16 11-18zM6 22c8-1 15 3 21 9-9 1-16-2-21-9zM54 22c-5 7-12 10-21 9 6-6 13-10 21-9z" fill="currentColor"/></svg><div class="ct">${b.zh}</div><div class="cs">${b.sub}</div><div class="ce">${b.en}</div></div></div>`}

 setTimeout(()=>{c.hidden=false;c.innerHTML=`<div class="covwrap">${coverHTML(b,1)}<div class="covinfo"><h2>${b.zh}</h2><h3>${b.en}</h3><p class="${S.lang==='zh'?'zhp':''}">${tt(b.intro[0],b.intro[1])}</p><div class="row"><button class="btn" id="kneelRead"><small>跪坐诵读</small>Kneel and read</button><button class="btn ghost" id="backShelf">${tt('Put it back','放回书架')}</button></div></div></div>`;

let RD={b:null,p:0};
function pageHTML(b,p){if(p===0)return `<div class="pg intro"><div class="ph">${b.zh}<span>${b.en}</span></div><div class="ptitle">${b.zh}</div><div class="psub">${b.sub}<br><i>${b.subEn}</i></div><p class="zhp">${b.intro[1]}</p><p><i>${b.intro[0]}</i></p><div class="pf">${tt('Turn the page to begin','翻页开始诵读')} ›</div></div>`;
 const P=b.pages[p-1];let n=P.start||0;
 return `<div class="pg"><div class="ph">${b.zh}<span>${p} / ${b.pages.length}</span></div><div class="pl">${P.lines.map(l=>`<div class="ln">${b.num?`<em>${n++}</em>`:''}${l.map(([c,py])=>py?`<ruby>${c}<rt>${py}</rt></ruby>`:`<span class="pu">${c}</span>`).join('')}</div>`).join('')}</div>${P.en?`<div class="pe">${P.en}</div>`:''}<div class="pf">${p<b.pages.length?'›':tt('End · 回向','回向 · 圆满')}</div></div>`}

 $('#mbar').hidden=true;AU.bell(196,.35);

 const fl=old.cloneNode(true);fl.classList.add('flip',d>0?'fwd':'back');bk.innerHTML=pageHTML(b,np);bk.appendChild(fl);RD.p=np;AU.click(.15,900);setTimeout(()=>fl.remove(),650)}
